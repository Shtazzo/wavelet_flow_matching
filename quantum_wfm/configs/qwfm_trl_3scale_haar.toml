# [ED] Q-WFM fine-tuning on Turbulent Radiative Layer 2D (spec: quantum_wfm/DESIGN.md).
# Everything not set here comes from base_config (the paper's TOML for the warm-start checkpoint).
# Relative paths are resolved against the repository root.
base_config = "configs/turbulent_radiative_layer_2D/WaveletFlow_turbulent_radiative_layer_2D_3scales_haar_ablation_v4.0.toml"

[main]
    exp_name = "QWFM_turbulent_radiative_layer_2D_3scale_haar"

[path]
    well_base_path   = "data/datasets"
    stats_path       = "data/datasets/turbulent_radiative_layer_2D/stats.yaml"
    experiments_path = "experiments/turbulent_radiative_layer_2D"

[warm_start]
    model = "WFM_3scale_haar"          # Hugging Face checkpoint (wavelet_flow_matching/hub.py); or ckpt_path = "..."

[quantum]
    kind     = "quantum"               # "quantum" (Q-WFM) or "classical" (C-WFM control)
    n_qubits = 8
    n_layers = 4
    backend  = "pennylane"             # training needs "pennylane"; "qiskit" is for equivalence / inference

[finetune]
    epochs        = 10
    lr            = 1e-3
    warmup_epochs = 0                  # 0 = cosine from lr at epoch 0 (QuantumWaveletFlowModule.configure_optimizers)
    weight_decay  = 1e-2
    eta_min       = 1e-7

[lightning.datamodules]
    data_workers = 8

[lightning.trainer]
    accelerator = "auto"
    strategy    = "auto"
    precision   = "32-true"
